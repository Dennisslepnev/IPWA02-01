<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core">

<f:metadata>
    <f:viewAction action="#{loginBean.checkScientistAccess}" />
</f:metadata>

<h:head>
    <meta charset="UTF-8" />
    <title>Like Hero To Zero - Verwaltung</title>
    <h:outputStylesheet library="css" name="app.css" />
</h:head>

<h:body>

    <header class="header">
        <div class="header-inner">
            <h1>Like Hero To Zero</h1>
        </div>
    </header>

    <nav class="navigation">
        <div class="navigation-inner">

            <h:link value="Startseite"
                    outcome="index" />

            <h:link value="CO₂-Suche"
                    outcome="search" />

            <h:link value="Verwaltung"
                    outcome="admin"
                    styleClass="active-nav-link"
                    rendered="#{loginBean.scientist}" />

            <h:link value="Freigaben"
                    outcome="approval"
                    rendered="#{loginBean.editor}" />

            <h:form rendered="#{loginBean.loggedIn}">
                <h:commandLink value="Abmelden"
                               action="#{loginBean.logout}" />
            </h:form>

        </div>
    </nav>

    <main class="content">

        <h:panelGroup rendered="#{loginBean.scientist}">

            <div class="page-heading">

                <div>
                    <h2>Emissionsdaten erfassen</h2>

                    <p class="intro-text">
                        Erfasse einen neuen CO₂-Emissionsdatensatz.
                        Neue Einträge werden zunächst zur Freigabe vorgemerkt.
                    </p>
                </div>

                <div class="user-info">
                    <span>Angemeldet als</span>

                    <strong>
                        <h:outputText value="#{loginBean.loggedInUser.username}" />
                    </strong>
                </div>

            </div>

            <h:form>

                <div class="form-grid">

                    <div class="form-group">

                        <h:outputLabel for="country"
                                       value="Land" />

                        <h:selectOneMenu id="country"
                                         value="#{emissionAdminBean.selectedCountryId}"
                                         required="true"
                                         requiredMessage="Bitte wählen Sie ein Land aus.">

                            <f:selectItem itemLabel="Bitte auswählen"
                                          itemValue="#{null}" />

                            <f:selectItems value="#{emissionAdminBean.countries}"
                                           var="country"
                                           itemValue="#{country.id}"
                                           itemLabel="#{country.name}" />

                        </h:selectOneMenu>

                        

                    </div>

                    <div class="form-group">

                        <h:outputLabel for="year"
                                       value="Jahr" />

                        <h:inputText id="year"
                                     value="#{emissionAdminBean.year}"
                                     required="true"
                                     requiredMessage="Bitte geben Sie ein Jahr ein."
                                     converterMessage="Bitte geben Sie das Jahr als ganze Zahl ein."
                                     validatorMessage="Das Jahr muss zwischen 1900 und #{emissionAdminBean.currentYear} liegen.">

                            <f:validateLongRange
                                minimum="1900"
                                maximum="#{emissionAdminBean.currentYear}" />

                        </h:inputText>

                       

                    </div>

                    <div class="form-group">

                        <h:outputLabel for="co2Value"
                                       value="CO₂-Ausstoß in Kilotonnen" />

                        <h:inputText id="co2Value"
                                     value="#{emissionAdminBean.co2Value}"
                                     required="true"
                                     requiredMessage="Bitte geben Sie einen CO₂-Wert ein."
                                     converterMessage="Bitte geben Sie einen gültigen numerischen CO₂-Wert ein."
                                     validatorMessage="Der CO₂-Wert muss größer als 0 sein.">

                            <f:validateDoubleRange minimum="0.01" />

                        </h:inputText>

                        

                    </div>

                </div>

                <h:commandButton value="Datensatz speichern"
                 action="#{emissionAdminBean.saveEmission}" />

<h:messages
    showDetail="true"
    showSummary="false"
    layout="list"
    styleClass="form-error-list"
    style="color: #b42318 !important;" />

                <h:panelGroup rendered="#{not empty emissionAdminBean.successMessage}">
                    <div class="message-box success-box">
                        <h:outputText value="#{emissionAdminBean.successMessage}" />
                    </div>
                </h:panelGroup>

                <h:panelGroup rendered="#{not empty emissionAdminBean.errorMessage}">
                    <div class="message-box error-box">
                        <h:outputText value="#{emissionAdminBean.errorMessage}" />
                    </div>
                </h:panelGroup>

            </h:form>

        </h:panelGroup>

        <h:panelGroup rendered="#{not loginBean.scientist}">

            <h2>Zugriff nicht erlaubt</h2>

            <p class="intro-text">
                Diese Seite ist ausschließlich für angemeldete
                Wissenschaftler:innen zugänglich.
            </p>

            <h:link value="Zum Login"
                    outcome="login" />

        </h:panelGroup>

    </main>

</h:body>
</html>
