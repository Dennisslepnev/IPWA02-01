<!DOCTYPE html>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:ui="jakarta.faces.facelets">

    <nav>
        <h:link value="Startseite" outcome="index" />
        <span> | </span>

        <h:link value="CO₂-Suche" outcome="search" />
        <span> | </span>

        <h:link value="Login"
                outcome="login"
                rendered="#{not loginBean.loggedIn}" />

        <h:panelGroup rendered="#{loginBean.loggedIn}">
            <h:link value="Verwaltung"
                    outcome="admin"
                    rendered="#{loginBean.scientist}" />

            <h:panelGroup rendered="#{loginBean.scientist}">
                <span> | </span>
            </h:panelGroup>

            <h:link value="Freigaben"
                    outcome="approval"
                    rendered="#{loginBean.editor}" />

            <span> | </span>

            <h:form style="display:inline;">
                <h:commandLink value="Abmelden"
                               action="#{loginBean.logout}" />
            </h:form>
        </h:panelGroup>
    </nav>

    <hr />

</ui:composition>
