<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html">

<h:head>
    <title>Like Hero To Zero - Login</title>
    <h:outputStylesheet library="css" name="app.css" />
</h:head>

<h:body>

    <header class="header">
        <div class="header-inner">
            <h1>Like Hero To Zero</h1>
        </div>
    </header>

    <nav class="navigation">
        <div class="navigation-inner">

            <h:link value="Startseite"
                    outcome="index" />

            <h:link value="CO₂-Suche"
                    outcome="search" />

            <h:link value="Login"
                    outcome="login"
                    styleClass="active-nav-link"
                    rendered="#{not loginBean.loggedIn}" />

            <h:link value="Verwaltung"
                    outcome="admin"
                    rendered="#{loginBean.scientist}" />

            <h:link value="Freigaben"
                    outcome="approval"
                    rendered="#{loginBean.editor}" />

            <h:form rendered="#{loginBean.loggedIn}">
                <h:commandLink value="Abmelden"
                               action="#{loginBean.logout}" />
            </h:form>

        </div>
    </nav>

    <main class="content login-card">

        <h2>Anmeldung</h2>

        <p class="intro-text">
            Melde dich an, um neue Emissionsdaten zu erfassen
            oder offene Datensätze zu prüfen.
        </p>

        <h:form>

            <div class="form-group">

                <h:outputLabel for="username"
                               value="Benutzername" />

                <h:inputText id="username"
                             value="#{loginBean.username}"
                             required="true"
                             requiredMessage="Bitte einen Benutzernamen eingeben." />

            </div>

            <div class="form-group">

                <h:outputLabel for="password"
                               value="Passwort" />

                <h:inputSecret id="password"
                               value="#{loginBean.password}"
                               required="true"
                               requiredMessage="Bitte ein Passwort eingeben." />

            </div>

            <h:commandButton value="Anmelden"
                             action="#{loginBean.login}" />

            <h:messages styleClass="error-message" />

            <h:panelGroup rendered="#{not empty loginBean.errorMessage}">
                <p class="error-message">
                    <h:outputText value="#{loginBean.errorMessage}" />
                </p>
            </h:panelGroup>

        </h:form>

        <div class="secondary-link">
            <h:link value="Zur öffentlichen CO₂-Suche"
                    outcome="search" />
        </div>

    </main>

</h:body>
</html>
